<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD58 Club · Panel</title><link rel="stylesheet" href="/estilos.css"><link rel="stylesheet" href="/panel.css"></head>
<body>
<header class="marca"><span class="logo">MD58</span><span class="club">CLUB · PANEL</span><span class="usuario" id="usuario"></span></header>
<main class="ancho">
  <section class="kpis" id="kpis"></section>
  <p class="chico" id="estado"></p>
  <h2>Registros por local</h2><div class="tabla-wrap"><table id="t-local"></table></div>
  <h2>Por vendedor</h2><div class="tabla-wrap"><table id="t-vendedor"></table></div>
  <h2>Por día</h2><div class="tabla-wrap"><table id="t-dia"></table></div>
  <h2>Exportar</h2><p><a class="boton secundario" href="/panel/export.csv">Descargar socios (CSV, datos personales)</a></p>
  <h2>Notificación de prueba</h2>
  <form id="f-push" class="fila-form"><input name="dni" inputmode="numeric" placeholder="DNI del socio"><input name="texto" placeholder="Texto (opcional)"><button class="boton">Enviar</button></form>
  <p class="chico" id="push-res"></p>
</main>
<script src="/panel.js"></script></body></html>
