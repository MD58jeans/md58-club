<!doctype html>
<html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD58 Club · Caja</title><link rel="stylesheet" href="/estilos.css"></head>
<body>
<header class="marca"><span class="logo">MD58</span><span class="club">CLUB · CAJA</span></header>
<main>
  <h1 id="local">Caja</h1>
  <p class="sub">Después de cada venta: escribí el <b>DNI</b> del cliente y tocá <b>Guardar</b>. Si tiene la tarjeta del Club, escaneala.</p>
  <form id="f" novalidate>
    <button type="button" class="boton secundario" id="escanear" hidden>Escanear tarjeta</button>
    <video id="video" playsinline muted hidden></video>
    <label>DNI del cliente<input name="dni" inputmode="numeric" pattern="[0-9.]*" maxlength="10" autocomplete="off" required autofocus class="dni-grande"></label>
    <p id="socio" class="chico"></p>
    <details class="chico"><summary>Agregar N° de factura (opcional)</summary><label>N° de comprobante<input name="comprobante" maxlength="40" autocomplete="off"></label></details>
    <label id="l-vend" hidden>Vendedor<select name="vendedor"><option value="">—</option></select></label>
    <p class="error" id="err" hidden></p><p class="ok" id="ok" hidden></p>
    <button class="boton">Guardar</button>
    <p class="chico">Guardadas hoy en este celular: <b id="cuenta">0</b></p>
  </form>
</main>
<script src="/caja.js"></script></body></html>
