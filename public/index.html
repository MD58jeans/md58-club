<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD58 Club</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MD58 Club">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png">
<link rel="icon" href="/iconos/icono-192.png">
<link id="manifest" rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/estilos.css">
</head>
<body>
<header class="marca"><span class="logo">MD58</span><span class="club">CLUB</span></header>
<main id="app"><p class="cargando">Cargando…</p></main>
<footer class="pie"><a href="/terminos">Términos y datos personales</a></footer>
<template id="t-registro">
  <section>
    <h1>Sumate al MD58 Club</h1>
    <p class="sub">Registrate en 1 minuto y te regalamos <b>15% OFF</b> para usar en enero.</p>
    <p class="local" data-local></p>
    <form novalidate>
      <div class="fila2">
        <label>Nombre<input name="nombre" autocomplete="given-name" required maxlength="60"></label>
        <label>Apellido<input name="apellido" autocomplete="family-name" required maxlength="60"></label>
      </div>
      <label>DNI<input name="dni" inputmode="numeric" pattern="[0-9]*" required maxlength="10" placeholder="Sin puntos"></label>
      <label>Celular<input name="celular" type="tel" inputmode="tel" autocomplete="tel-national" required placeholder="Ej. 11 2345 6789"></label>
      <label>Email<input name="email" type="email" inputmode="email" autocomplete="email" required></label>
      <label>Fecha de nacimiento<input name="nacimiento" type="date" required></label>
      <label><span>Localidad <span class="opc">(opcional)</span></span><input name="localidad" autocomplete="address-level2" maxlength="60"></label>
      <label data-vendedor hidden><span>¿Quién te atendió? <span class="opc">(opcional)</span></span><select name="vendedor"><option value="">—</option></select></label>
      <label class="check"><input type="checkbox" name="acepta_datos"> <span>Acepto los <a href="/terminos" target="_blank">términos</a> y el uso de mis datos para el Club.</span></label>
      <label class="check"><input type="checkbox" name="acepta_promos"> <span>Quiero recibir novedades y beneficios. <span class="opc">(opcional)</span></span></label>
      <p class="error" data-error hidden></p>
      <button type="submit" class="boton">Quiero ser socio</button>
    </form>
    <p class="chico">¿Ya sos socio? <a href="/recuperar">Abrí tu tarjeta</a></p>
  </section>
</template>
<template id="t-tarjeta">
  <section>
    <div class="tarjeta">
      <div class="t-arriba"><span class="logo">MD58</span><span class="club">CLUB</span></div>
      <div class="t-nombre" data-nombre></div>
      <div class="t-socio">Socio N° <span data-dni></span></div>
      <div class="t-qr" data-qr></div>
    </div>
    <div class="beneficio" data-beneficio hidden></div>
    <div class="aviso" data-email hidden>Te mandamos un mail para confirmar tu email. <button type="button" class="link" data-reenviar>Reenviar</button></div>
    <div class="bloque" data-instalar hidden>
      <h2>Guardá tu tarjeta en el celular</h2>
      <button type="button" class="boton" data-ver-guia hidden>Ver cómo, paso a paso</button>
      <div data-ios hidden>
        <ol>
          <li>En Safari, tocá <b>Compartir</b> <span class="icono-compartir" aria-hidden="true">⬆︎</span>. En los iPhone nuevos está adentro de los <b>tres puntitos (···)</b>, abajo a la derecha.</li>
          <li>Bajá en la lista y elegí <b>Agregar a inicio</b> (o "Agregar a pantalla de inicio") y después <b>Agregar</b>.</li>
          <li>Abrí <b>MD58 Club</b> desde el ícono nuevo y activá las notificaciones.</li>
        </ol>
        <p class="chico" data-ios-no-safari hidden>Si estás en otro navegador (Instagram, Chrome), abrí este link en <b>Safari</b>.</p>
      </div>
      <div data-android hidden>
        <button type="button" class="boton" data-boton-instalar hidden>Agregar a la pantalla de inicio</button>
        <p data-android-manual>Tocá el menú <b>⋮</b> de Chrome y elegí <b>Agregar a la pantalla principal</b> (o <b>Instalar app</b>).</p>
      </div>
    </div>
    <div class="bloque" data-notif hidden>
      <h2>Enterate primero</h2>
      <p>Avisos de ingresos en tu talle, preventas y beneficios. Nada de spam.</p>
      <button type="button" class="boton" data-activar>Activar notificaciones</button>
      <p class="chico" data-notif-estado></p>
    </div>
    <label class="check bloque"><input type="checkbox" data-promos> <span>Quiero recibir novedades y beneficios de MD58.</span></label>
  </section>
</template>
<template id="t-guia-ios">
  <div class="guia-fondo" data-guia>
    <div class="guia" role="dialog" aria-modal="true" aria-labelledby="guia-titulo">
            <div class="guia-paso" data-paso="1">
        <h2 id="guia-titulo">Guardá tu tarjeta en el celular</h2>
        <p class="guia-txt">Son 3 toques. Leelos y después hacelos.</p>
        <p class="guia-grande">1 · Tocá <b>···</b> abajo a la derecha</p>
        <svg class="guia-dibujo" viewBox="0 0 300 70" aria-hidden="true"><rect x="2" y="8" width="296" height="54" rx="27" fill="#ececec"/><rect x="18" y="20" width="34" height="30" rx="15" fill="#fff"/><path d="M38 28l-8 7 8 7" stroke="#555" stroke-width="3" fill="none"/><rect x="64" y="20" width="170" height="30" rx="15" fill="#fff"/><text x="149" y="40" font-size="14" text-anchor="middle" fill="#333">md58club.com</text><circle cx="262" cy="35" r="19" fill="#0b0b0b"/><circle cx="252" cy="35" r="3" fill="#fff"/><circle cx="262" cy="35" r="3" fill="#fff"/><circle cx="272" cy="35" r="3" fill="#fff"/></svg>
        <p class="chico">Si en tu iPhone ves abajo el botón <b>Compartir</b> <span class="icono-compartir">⬆︎</span>, tocá ese y salteá al paso 3.</p>
      </div>
      <div class="guia-paso" data-paso="2" hidden>
        <p class="guia-grande">2 · Tocá <b>Compartir</b></p>
        <svg class="guia-dibujo" viewBox="0 0 300 120" aria-hidden="true"><rect x="40" y="6" width="220" height="108" rx="16" fill="#fff" stroke="#d9d9d9"/><rect x="56" y="20" width="188" height="36" rx="10" fill="#0b0b0b"/><path d="M90 46v-16m0 0l-6 6m6-6l6 6M82 34v14h16V34" stroke="#fff" stroke-width="2.5" fill="none"/><text x="160" y="43" font-size="15" text-anchor="middle" fill="#fff" font-weight="700">Compartir</text><rect x="56" y="66" width="188" height="36" rx="10" fill="#f2f2f2"/><text x="150" y="89" font-size="14" text-anchor="middle" fill="#888">Otras opciones…</text></svg>
        <p class="chico">Se abre un panel con contactos y apps: <b>no toques ninguno</b>, no se comparte con nadie.</p>
      </div>
      <div class="guia-paso" data-paso="3" hidden>
        <p class="guia-grande">3 · Deslizá hacia arriba y tocá <b>Agregar a inicio</b></p>
        <svg class="guia-dibujo" viewBox="0 0 300 120" aria-hidden="true"><rect x="20" y="6" width="260" height="108" rx="16" fill="#fff" stroke="#d9d9d9"/><text x="40" y="34" font-size="14" fill="#999">Copiar</text><line x1="36" y1="46" x2="264" y2="46" stroke="#eee"/><rect x="30" y="52" width="240" height="40" rx="10" fill="#0b0b0b"/><text x="46" y="77" font-size="15" fill="#fff" font-weight="700">Agregar a inicio</text><rect x="236" y="61" width="22" height="22" rx="5" fill="none" stroke="#fff" stroke-width="2"/><path d="M247 66v12M241 72h12" stroke="#fff" stroke-width="2"/><text x="40" y="108" font-size="13" fill="#bbb">Agregar marcador  ✗</text></svg>
        <p class="chico">Ojo: <b>no</b> es "Agregar marcador" ni "Favoritos". Después tocá <b>Agregar</b> arriba a la derecha.</p>
        <p class="guia-grande">Listo: abrí <b>MD58 Club</b> desde el ícono nuevo 📲</p>
      </div>
      <div class="guia-botones"><button type="button" class="boton" data-sig>Entendido</button><button type="button" class="link" data-cerrar>Más tarde</button></div>
    </div>
    <div class="guia-flecha" data-flecha aria-hidden="true">↓</div>
  </div>
</template>
<template id="t-otro-navegador">
  <div class="bloque destacado">
    <h2>Abrilo en Safari para guardar tu tarjeta</h2>
    <p>Estás en otro navegador (Instagram, Chrome…). Copiá el link y pegalo en <b>Safari</b>.</p>
    <button type="button" class="boton" data-copiar>Copiar link</button>
    <p class="chico" data-copiado hidden>✓ Copiado. Abrí Safari y pegalo arriba.</p>
  </div>
</template>
<template id="t-recuperar">
  <section>
    <h1>Abrí tu tarjeta</h1>
    <p class="sub">Poné tu DNI y te mandamos el link a tu email.</p>
    <form novalidate><label>DNI<input name="dni" inputmode="numeric" required maxlength="10"></label>
      <p class="error" data-error hidden></p><button class="boton">Mandarme el link</button></form>
    <p class="ok" data-ok hidden></p>
  </section>
</template>
<template id="t-inicio">
  <section>
    <h1>MD58 Club</h1>
    <p class="sub">Para sumarte, escaneá el QR que está en la caja de tu local MD58.</p>
    <p><a class="boton secundario" href="/recuperar">Ya soy socio: abrir mi tarjeta</a></p>
  </section>
</template>
<script src="/vendor/qrcode.js"></script>
<script src="/app.js"></script>
</body>
</html>
